name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# The repository default token is write-scoped and can approve pull requests, while every job here
# runs `npm ci` and therefore arbitrary postinstall scripts from the dependency tree. Nothing in
# this workflow writes anything back, so read is all it gets. Declared at the top level so a job
# added later inherits the restriction rather than the default.
permissions:
  contents: read

# A superseded push to a pull request has nothing left to prove, so cancel it.
# Pushes to main are never cancelled: every commit on main gets its own answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Defined in verify.yml so that tag builds run this exact job rather than a copy of it.
  # See the comment at the top of that file.
  verify:
    uses: ./.github/workflows/verify.yml

  # Lint used to be a separate non-blocking job here. It is a blocking ratchet in verify.yml now
  # (scripts/lint-ratchet.mjs), so tags are held to it as well.
