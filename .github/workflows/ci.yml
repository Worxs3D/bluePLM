name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# The repository default token is write-scoped and can approve pull requests, while every job here
# runs `npm ci` and therefore arbitrary postinstall scripts from the dependency tree. Nothing in
# this workflow writes anything back, so read is all it gets. Declared at the top level so a job
# added later inherits the restriction rather than the default.
permissions:
  contents: read

# A superseded push to a pull request has nothing left to prove, so cancel it.
# Pushes to main are never cancelled: every commit on main gets its own answer.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Defined in verify.yml so that tag builds run this exact job rather than a copy of it.
  # See the comment at the top of that file.
  verify:
    uses: ./.github/workflows/verify.yml
    secrets:
      SOLIDWORKS_DM_LICENSE_KEY: ${{ secrets.SOLIDWORKS_DM_LICENSE_KEY }}
      CI_ASSETS_TOKEN: ${{ secrets.CI_ASSETS_TOKEN }}

  # Lint is enforced by the reusable verification workflow's ratchet, including tag builds.
  # The reusable verification job runs on Linux and cannot compile or execute the
  # optional Win32 addon/host harnesses. Keep this focused Windows contract gate
  # in CI without changing the release workflow's existing verification policy.
  edrawings-windows:
    name: eDrawings Windows contracts
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Install dependencies
        run: npm ci

      - name: Test eDrawings Windows contracts
        run: npm run test:edrawings-windows
